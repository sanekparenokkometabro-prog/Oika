<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Затишок Kids — Дитячий одяг</title>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #2C3531;
            --text-secondary: #7C8580;
            --accent-color: #8EA89D;
            --accent-hover: #739083;
            --border-color: #E3E0D8;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .btn-admin {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .hero {
            padding: 40px 0 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin: 40px 0 60px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Галерея з прокруткою фото в карточці */
        .product-gallery {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #EFECE6;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .product-gallery::-webkit-scrollbar {
            display: none;
        }

        .product-gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: start;
            cursor: pointer;
        }

        .product-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: auto;
            margin-bottom: 12px;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Модальні вікна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 53, 49, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .admin-modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 10;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            outline: none;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Модальне вікно для зуму фото */
        .zoom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            overflow: hidden;
            touch-action: none;
        }

        .zoom-modal.active {
            display: flex;
        }

        .zoom-modal img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="#" class="logo">Затишок<span>Kids</span></a>
            <button class="btn-admin" id="open-admin">Додати товар (Адмін)</button>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Якісний та зручний одяг для малюків</h1>
            <p>Підібрано з турботою та любов'ю до деталей</p>
        </section>

        <div class="products-grid" id="products-container">
            <div class="no-products">Завантаження товарів...</div>
        </div>
    </div>

    <!-- Модальне вікно адмін-панелі -->
    <div class="modal-overlay" id="admin-modal">
        <div class="admin-modal">
            <button class="close-modal" id="close-admin">&times;</button>
            <h2 style="margin-bottom: 20px;">Додати новий товар</h2>
            
            <form id="add-product-form">
                <div class="form-group">
                    <label for="title">Назва товару</label>
                    <input type="text" id="title" required placeholder="Наприклад: Комбінезон велюровий">
                </div>

                <div class="form-group">
                    <label for="category">Категорія</label>
                    <select id="category">
                        <option value="Немовлята">Немовлята</option>
                        <option value="Костюми">Костюми</option>
                        <option value="Верхній одяг">Верхній одяг</option>
                        <option value="Взуття">Взуття</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Ціна (грн)</label>
                    <input type="number" id="price" required placeholder="450">
                </div>

                <div class="form-group">
                    <label for="description">Опис</label>
                    <textarea id="description" style="height: 90px;" placeholder="Стан, склад тканини, розмір..."></textarea>
                </div>

                <div class="form-group">
                    <label for="images">Фотографії (можна вибрати кілька)</label>
                    <input type="file" id="images" accept="image/*" multiple>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Опублікувати оголошення</button>
            </form>
        </div>
    </div>

    <!-- Модальне вікно для зуму картинок -->
    <div class="zoom-modal" id="zoom-modal">
        <button class="close-modal" id="close-zoom" style="color: white; font-size: 30px;">&times;</button>
        <img id="zoomed-img" src="" alt="Zoomed">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwdidcerlfczccmqioby.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_06UBKOGh2dwXy6WK8VkO4w_wJGn0FfA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Кнопки управління адмінкою
        const modal = document.getElementById('admin-modal');
        document.getElementById('open-admin').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-admin').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        // Завантаження товарів
        async function loadProducts() {
            const container = document.getElementById('products-container');
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="no-products">Помилка завантаження: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="no-products">Поки що немає жодного оголошення. Натисніть кнопку "Додати товар" зверху!</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                let imagesHtml = '';
                // Перевіряємо зображення (може бути масив або строка через кому)
                let imgs = [];
                if (Array.isArray(product.image_url)) {
                    imgs = product.image_url;
                } else if (typeof product.image_url === 'string' && product.image_url) {
                    try { imgs = JSON.parse(product.image_url); } catch(e) { imgs = [product.image_url]; }
                }

                if (imgs.length === 0) imgs = ['https://via.placeholder.com/300x220?text=No+Photo'];

                imgs.forEach(url => {
                    imagesHtml += `<img src="${url}" alt="${product.title}" onclick="openZoom('${url}')">`;
                });

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-gallery">${imagesHtml}</div>
                    <div class="product-content">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Відправка форми з кількома фото
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'Зберігається...';
            submitBtn.disabled = true;

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = Number(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const imageFiles = document.getElementById('images').files;

            let uploadedUrls = [];

                for (let i = 0; i < imageFiles.length; i++) {
                const file = imageFiles[i];
                const fileName = `${Date.now()}_${i}_${file.name}`;
                const { error: uploadError } = await supabaseClient.storage
                    .from('images') // <--- ЗМІНИЛИ НА 'images'
                    .upload(fileName, file);

                if (!uploadError) {
                    const { data: publicUrlData } = supabaseClient.storage
                        .from('images')
                        .getPublicUrl(fileName);
                    uploadedUrls.push(publicUrlData.publicUrl);
                }
            }

            const { error: insertError } = await supabaseClient
                .from('products')
                .insert([{ title, category, price, description, image_url: uploadedUrls }]);

            if (insertError) {
                alert('Помилка збереження товару: ' + insertError.message);
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
            } else {
                alert('Товар успішно додано!');
                modal.classList.remove('active');
                document.getElementById('add-product-form').reset();
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
                loadProducts();
            }
        });

        // Логіка Зуму (Pinch-to-zoom / переміщення)
        const zoomModal = document.getElementById('zoom-modal');
        const zoomedImg = document.getElementById('zoomed-img');
        let scale = 1, posX = 0, posY = 0, startX = 0, startY = 0, isDragging = false;

        window.openZoom = function(url) {
            zoomedImg.src = url;
            scale = 1; posX = 0; posY = 0;
            updateTransform();
            zoomModal.classList.add('active');
        }

        document.getElementById('close-zoom').addEventListener('click', () => zoomModal.classList.remove('active'));
        zoomModal.addEventListener('click', (e) => { if(e.target === zoomModal) zoomModal.classList.remove('active'); });

        function updateTransform() {
            zoomedImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        zoomedImg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - posX;
                startY = e.touches[0].clientY - posY;
            }
        });

        zoomedImg.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                posX = e.touches[0].clientX - startX;
                posY = e.touches[0].clientY - startY;
                updateTransform();
            }
        });

        zoomedImg.addEventListener('touchend', () => { isDragging = false; });

        // Подвійний тап для збільшення/скидання
        let lastTap = 0;
        zoomedImg.addEventListener('click', (e) => {
            let now = new Date().getTime();
            if (now - lastTap < 300) {
                scale = scale === 1 ? 2.5 : 1;
                posX = 0; posY = 0;
                updateTransform();
            }
            lastTap = now;
        });

        loadProducts();
    </script>
</body>
</html>
