<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Затишок Kids — Дитячий одяг</title>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-primary: #2C3531;
            --text-secondary: #7C8580;
            --accent-color: #8EA89D;
            --accent-hover: #739083;
            --border-color: #E3E0D8;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .btn-admin {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-admin:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .hero {
            padding: 40px 0 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin: 40px 0 60px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.04);
        }

        .product-img {
            width: 100%;
            height: 220px;
            background-color: #EFECE6;
            object-fit: cover;
        }

        .product-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: auto;
            margin-bottom: 12px;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Модальне вікно адмінки */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 53, 49, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .admin-modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .admin-modal h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-flex">
            <a href="#" class="logo">Затишок<span>Kids</span></a>
            <button class="btn-admin" id="open-admin">Додати товар (Адмін)</button>
        </div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Якісний та зручний одяг для малюків</h1>
            <p>Підібрано з турботою та любов'ю до деталей</p>
        </section>

        <div class="products-grid" id="products-container">
            <div class="no-products">Завантаження товарів...</div>
        </div>
    </div>

    <!-- Модальне вікно адмін-панелі -->
    <div class="modal-overlay" id="admin-modal">
        <div class="admin-modal">
            <button class="close-modal" id="close-admin">&times;</button>
            <h2>Додати новий товар</h2>
            
            <form id="add-product-form">
                <div class="form-group">
                    <label for="title">Назва товару</label>
                    <input type="text" id="title" required placeholder="Наприклад: Комбінезон велюровий">
                </div>

                <div class="form-group">
                    <label for="category">Категорія</label>
                    <select id="category">
                        <option value="Немовлята">Немовлята</option>
                        <option value="Костюми">Костюми</option>
                        <option value="Верхній одяг">Верхній одяг</option>
                        <option value="Взуття">Взуття</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Ціна (грн)</label>
                    <input type="number" id="price" required placeholder="450">
                </div>

                <div class="form-group">
                    <label for="description">Опис</label>
                    <textarea id="description" placeholder="Стан, склад тканини, розмір..."></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Фотографія товару</label>
                    <input type="file" id="image" accept="image/*">
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Опублікувати оголошення</button>
            </form>
        </div>
    </div>

    <!-- Підключаємо Supabase SDK та логіку -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwdidcerlfczccmqioby.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_06UBKOGh2dwXy6WK8VkO4w_wJGn0FfA';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Кнопки управління модальним вікном адмінки
        const modal = document.getElementById('admin-modal');
        document.getElementById('open-admin').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-admin').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // Завантаження товарів на головну сторінку
        async function loadProducts() {
            const container = document.getElementById('products-container');
            
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="no-products">Помилка завантаження: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="no-products">Поки що немає жодного оголошення. Натисніть кнопку "Додати товар" зверху!</div>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image_url || 'https://via.placeholder.com/300x220?text=No+Photo'}" alt="${product.title}" class="product-img">
                    <div class="product-content">
                        <span class="product-category">${product.category}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <div class="product-price">${product.price} грн</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Обробка форми додавання товару
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'Зберігається...';
            submitBtn.disabled = true;

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const price = Number(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const imageFile = document.getElementById('image').files[0];

            let imageUrl = '';

            if (imageFile) {
                const fileName = `${Date.now()}_${imageFile.name}`;
                const { error: uploadError } = await supabaseClient.storage
                    .from('product-images')
                    .upload(fileName, imageFile);

                if (uploadError) {
                    alert('Помилка завантаження фото: ' + uploadError.message);
                    submitBtn.textContent = 'Опублікувати оголошення';
                    submitBtn.disabled = false;
                    return;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('product-images')
                    .getPublicUrl(fileName);
                
                imageUrl = publicUrlData.publicUrl;
            }

            const { error: insertError } = await supabaseClient
                .from('products')
                .insert([{ title, category, price, description, image_url: imageUrl }]);

            if (insertError) {
                alert('Помилка збереження товару: ' + insertError.message);
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
            } else {
                alert('Товар успішно додано!');
                modal.classList.remove('active');
                document.getElementById('add-product-form').reset();
                submitBtn.textContent = 'Опублікувати оголошення';
                submitBtn.disabled = false;
                loadProducts(); // Оновлюємо список товарів на сторінці без перезавантаження
            }
        });

        // Завантажуємо товари при відкритті сторінки
        loadProducts();
    </script>
</body>
</html>
